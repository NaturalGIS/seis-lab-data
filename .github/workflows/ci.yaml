name: Continuous Integration

on:
  # will run both when pushing a branch and when pushing a tag
  push:
  pull_request:

env:
  COLUMNS: 120
  TEST_RESULTS_DIR: test-results-json
  JSON_REPORT_OPTIONS: --json-report --json-report-omit collectors log streams
  PUBLISH_IMAGE: ${{ (github.ref_name == 'main' || github.ref_type == 'tag') && 'TRUE' || 'FALSE' }}
  IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}
  # version information baked into the docker image: the tag when building a tag,
  # otherwise the branch (for pull requests, their source branch)
  GIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  GIT_BRANCH: ${{ github.ref_type != 'tag' && (github.head_ref || github.ref_name) || '' }}

jobs:
  run_ci:
    runs-on: ubuntu-24.04
    outputs:
      image_digest: ${{ steps.push_image.outputs.digest }}
    steps:

      - name: "Grab code"
        uses: actions/checkout@v4.2.2

      - name: "Install uv"
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: "Install code with dev dependencies"
        run: uv sync --frozen --group dev

      - name: "Run ruff linter"
        run: uv run ruff check

      - name: "Run ruff formatter"
        run: uv run ruff format --check

      - name: "Determine docker-related metadata"
        id: docker_metadata
        uses: docker/metadata-action@v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{raw}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: "check generated docker metadata"
        run: |
          env | grep DOCKER_METADATA_OUTPUT
          echo 'OUTPUT LABELS = ${{ steps.docker_metadata.outputs.labels }}'
          echo 'OUTPUT TAGS = ${{ steps.docker_metadata.outputs.tags }}'
          echo 'OUTPUT ANNOTATIONS = ${{ steps.docker_metadata.outputs.annotations}}'

      - name: "Setup docker buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build docker image"
        uses: docker/build-push-action@v6
        with:
          # the push step below must use the same build args and labels, so that it
          # reuses the cached layers of this build rather than building the image again
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_TAG=${{ env.GIT_TAG }}
            GIT_BRANCH=${{ env.GIT_BRANCH }}
          push: false
          load: true
          file: docker/Dockerfile
          tags: |
            ${{ steps.docker_metadata.outputs.tags }}
          labels: |
            ${{ steps.docker_metadata.outputs.labels }}

      - name: "Run tests"
        run: |
          # the container user differs from the runner's, hence the open permissions
          mkdir --mode 777 ${{ env.TEST_RESULTS_DIR }}
          docker run --rm --entrypoint bash \
          --volume ${{ github.workspace }}/${{ env.TEST_RESULTS_DIR }}:/test-results \
          ${{ fromJSON(steps.docker_metadata.outputs.json).tags[0] }} -c \
          "uv sync --locked --group dev --group gdal && uv run pytest ${{ env.JSON_REPORT_OPTIONS }} --json-report-file=/test-results/unit.json"

      - name: "Stand up compose stack"
        run: |
          export IMAGE_URL=${{ fromJSON(steps.docker_metadata.outputs.json).tags[0] }}
          docker compose --file docker/compose.ci.yaml up --wait --wait-timeout 750  || COMPOSE_EXIT=$?
          if [ -n "$COMPOSE_EXIT" ]; then
            docker compose --file docker/compose.ci.yaml ps
            docker compose --file docker/compose.ci.yaml logs
          fi
          exit ${COMPOSE_EXIT:-0}


      - name: "Bootstrap stack"
        env:
            IMAGE_URL: ${{ fromJSON(steps.docker_metadata.outputs.json).tags[0] }}
        run: |
          docker compose --file docker/compose.ci.yaml exec -t webapp uv run seis-lab-data db upgrade
          docker compose --file docker/compose.ci.yaml exec -t webapp uv run seis-lab-data bootstrap all

      - name: "Run integration tests"
        id: integration_tests
        run: |
          IMAGE_URL=${{ fromJSON(steps.docker_metadata.outputs.json).tags[0] }} \
          docker compose --file docker/compose.ci.yaml exec -t webapp bash -c \
          "uv sync --locked --group dev --group gdal && uv run pytest -m integration ${{ env.JSON_REPORT_OPTIONS }} --json-report-file=/tmp/integration.json"

      - name: "Collect integration test results"
        if: ${{ !cancelled() && steps.integration_tests.outcome != 'skipped' }}
        run: |
          IMAGE_URL=${{ fromJSON(steps.docker_metadata.outputs.json).tags[0] }} \
          docker compose --file docker/compose.ci.yaml cp \
          webapp:/tmp/integration.json ${{ env.TEST_RESULTS_DIR }}/integration.json

      - name: "Prewarm OAuth login flow"
        run: |
          curl --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 \
            --location --output /dev/null --silent \
            http://localhost:8888/login

      - name: "Run end to end tests"
        run: |
          uv run playwright install --with-deps --only-shell chromium
          uv run pytest \
          tests/e2e \
          -m e2e \
          --confcutdir tests/e2e \
          --user-email akadmin@email.com \
          --user-password admin123 \
          --base-url http://localhost:8888 \
          --tracing retain-on-failure \
          ${{ env.JSON_REPORT_OPTIONS }} \
          --json-report-file=${{ env.TEST_RESULTS_DIR }}/e2e.json

      - name: "store e2e testing traces as artifacts"
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: test-results/

      - name: "store test results as artifacts"
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-json
          path: ${{ env.TEST_RESULTS_DIR }}/
          if-no-files-found: ignore

      - name: "Stand down compose stack"
        run: |
          IMAGE_URL=${{ fromJSON(steps.docker_metadata.outputs.json).tags[0] }} \
          docker compose --file docker/compose.ci.yaml down

      - name: "Login to container registry"
        if: ${{ env.PUBLISH_IMAGE == 'TRUE' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.CI_MANAGEMENT_USERNAME }}
          password: ${{ secrets.CI_MANAGEMENT_PAT }}

      - name: "Push docker image to registry"
        id: push_image
        if: ${{ env.PUBLISH_IMAGE == 'TRUE' }}
        uses: docker/build-push-action@v6
        with:
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_TAG=${{ env.GIT_TAG }}
            GIT_BRANCH=${{ env.GIT_BRANCH }}
          push: true
          file: docker/Dockerfile
          tags: |
            ${{ steps.docker_metadata.outputs.tags }}
          labels: |
            ${{ steps.docker_metadata.outputs.labels }}

  render_test_report:
    needs: run_ci
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    steps:

      - name: "Grab code"
        uses: actions/checkout@v4.2.2

      - name: "Install uv"
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: "Install system dependencies for weasyprint"
        run: |
          sudo apt update
          sudo apt-get install --yes \
              fonts-dejavu-core \
              libharfbuzz0b \
              libpango-1.0-0 \
              libpangoft2-1.0-0 \
              libpangocairo-1.0-0

      - name: "Grab test results"
        uses: actions/download-artifact@v4
        with:
          name: test-results-json
          path: ${{ env.TEST_RESULTS_DIR }}

      - name: "Render test report"
        run: |
          uv run --frozen --only-group report python scripts/render_test_report.py \
          --results ${{ env.TEST_RESULTS_DIR }}/*.json \
          --release ${{ github.ref_name }} \
          --commit ${{ github.sha }} \
          --output seis-lab-data-test-report-${{ github.ref_name }}.pdf

      - name: "store test report as artifact"
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.ref_name }}
          path: seis-lab-data-test-report-${{ github.ref_name }}.pdf
          # the maximum allowed for public repositories
          retention-days: 90

  trigger_deployment:
    needs: run_ci
    if: ${{ github.ref_name == 'main' || github.ref_type == 'tag' }}
    uses: ./.github/workflows/deployment-initiator.yml
    with:
      image_digest: ${{ needs.run_ci.outputs.image_digest }}
      tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
    secrets: inherit
