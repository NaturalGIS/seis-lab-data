{% macro render_button(url, text, aria_label, icon, classes="btn-primary") %}
    <button
            class="btn {{ classes }}"
            data-on:click="@get('{{ url }}')"
            aria-label="{{ aria_label }}"
    >
        <span class="material-icons-outlined me-1">{{ icon }}</span>{{ text | capitalize }}
    </button>
{% endmacro %}


{% macro render_link(url, text, aria_label, icon, classes="btn-primary", enabled=True) %}
    <a
            class="btn {% if enabled %}{{ classes }}{% else %}btn-outline-dark disabled{% endif %}"
            aria-label="{{ aria_label }}"
            {% if enabled %}
                href="{{ url }}"
            {% else %}
                tabindex="-1"
                aria-disabled="true"
            {% endif %}
    >
        <span class="material-icons-outlined me-1">{{ icon }}</span>{{ text | capitalize }}
    </a>
{% endmacro %}
