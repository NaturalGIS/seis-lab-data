site_name: seis-lab-data docs
site_url: !ENV [MKDOCS_SITE_URL, 'https://__SITE_URL_PLACEHOLDER__']
repo_url: https://github.com/naturalgis/seis-lab-data
site_author: Equipa NaturalGIS

hooks:
  - mkdocs/mkdocs_hooks.py

nav:
  - Início: index.md
  - Guia do utilizador: user-guide.md
  - Guia de administração do sistema: admin-guide.md
  - Guia do ambiente de testes: test-environment.md
  - Guia de desenvolvimento: development.md
  - Guia de escrita de documentação: writing-docs.md

extra_css:
  - stylesheets/styles.css

theme:
  name: material
  custom_dir: mkdocs
  palette:
    primary: blue grey
    accent: pink
  language: pt
  features:
    - content.footnote.tooltips
    - header.autohide
    - navigation.footer
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - toc.integrate

plugins:
  - search
  - i18n:
      # Relative switcher links keep working when the site is served under a path
      # prefix (e.g. /docs/), since the build-time site_url carries no path
      languages:
        - locale: pt
          name: Português
          default: true
          fixed_link: ./
        - locale: en
          name: English
          fixed_link: en/
          nav:
            - Home: index.md
            - User guide: user-guide.md
            - Administration Guide: admin-guide.md
            - Test environment: test-environment.md
            - Development: development.md
            - Writing docs: writing-docs.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
